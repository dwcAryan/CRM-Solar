# ==============================================================================
# Solar CRM - User Acceptance Testing (UAT) Scenario Catalog
# Phase 17: User Acceptance Testing (UAT)
# ==============================================================================

version: "1.0.0"
date: "2026-11-19"
system: "Solar CRM"

scenarios:
  # ----------------------------------------------------------------------------
  # SECTION 1: CORE CALL OUTCOMES (15 Out of 15)
  # ----------------------------------------------------------------------------
  - id: "UAT-001"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: No Answer triggers ladder increment"
    preconditions: "Lead exists in New status assigned to salesperson"
    steps:
      - "Open lead detail page"
      - "Click 'Log Activity' and select Call"
      - "Choose outcome 'No answer (NO_ANSWER)'"
      - "Enter mandatory remark and submit"
    expected_result: "Status updates to Attempting Contact, attempt count increments to 1, next follow-up scheduled"
    type: "auto"

  - id: "UAT-002"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Busy or Switched Off"
    preconditions: "Lead exists in Attempting Contact"
    steps:
      - "Log call outcome 'Busy or switched off (BUSY_SWITCHED_OFF)'"
      - "Provide note 'Line busy on second ring'"
    expected_result: "Next follow-up date set per outcome rule (+4 hours / next working day), status remains Attempting Contact"
    type: "auto"

  - id: "UAT-003"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Customer asks to call later"
    preconditions: "Lead exists in Attempting Contact"
    steps:
      - "Log call outcome 'Customer asks to call later (CALL_LATER)'"
      - "Pick custom follow-up date and time tomorrow 11:00 AM with remark"
    expected_result: "Next follow-up date updated to chosen slot, status set to Follow Up Scheduled"
    type: "auto"

  - id: "UAT-004"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Wrong or invalid number"
    preconditions: "Lead exists in New"
    steps:
      - "Log call outcome 'Wrong or invalid number (WRONG_INVALID_NUMBER)' with remark"
    expected_result: "Lead status transitions to Lost immediately with reason Invalid Contact"
    type: "auto"

  - id: "UAT-005"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Not the decision maker"
    preconditions: "Lead exists in New"
    steps:
      - "Log call outcome 'Not the decision maker (NOT_DECISION_MAKER)' with spouse contact remark"
    expected_result: "Lead status set to Follow Up Scheduled, remark saved to timeline"
    type: "auto"

  - id: "UAT-006"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Interested, wants more information"
    preconditions: "Lead in New status"
    steps:
      - "Log call outcome 'Interested, wants more information (INTERESTED_MORE_INFO)'"
      - "Add remark 'Interested in 5kW rooftop system, sent brochure'"
    expected_result: "Status advances to Interested, brochure dispatch activity logged"
    type: "auto"

  - id: "UAT-007"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Agrees, ready for site survey"
    preconditions: "Lead in Interested status"
    steps:
      - "Log call outcome 'Agrees, ready for site survey (AGREES_SURVEY)'"
    expected_result: "Status set to Survey to Schedule, survey booking modal unlocked"
    type: "auto"

  - id: "UAT-008"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Wants to discuss with family"
    preconditions: "Lead in Interested status"
    steps:
      - "Log call outcome 'Wants to discuss with family (DISCUSS_FAMILY)' with follow-up 3 days later"
    expected_result: "Status set to Follow Up Scheduled with exact date rule"
    type: "auto"

  - id: "UAT-009"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Price or budget concern"
    preconditions: "Lead in Interested status"
    steps:
      - "Log call outcome 'Price or budget concern (BUDGET_CONCERN)'"
    expected_result: "Lead moves to Nurture queue with reason waiting_budget"
    type: "auto"

  - id: "UAT-010"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Not interested for now"
    preconditions: "Lead in Interested status"
    steps:
      - "Log call outcome 'Not interested for now (NOT_INTERESTED_NOW)'"
    expected_result: "Lead moved to Nurture status with reminder set for 30 days"
    type: "auto"

  - id: "UAT-011"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Not interested at all"
    preconditions: "Lead in Attempting Contact"
    steps:
      - "Log call outcome 'Not interested at all (NOT_INTERESTED_ALL)' with mandatory reason"
    expected_result: "Lead marked Lost (not_interested)"
    type: "auto"

  - id: "UAT-012"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Already installed solar"
    preconditions: "Lead in New status"
    steps:
      - "Log call outcome 'Already installed solar (ALREADY_INSTALLED)'"
    expected_result: "Lead marked Lost (already_installed)"
    type: "auto"

  - id: "UAT-013"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Not the owner / no suitable roof"
    preconditions: "Lead in New status"
    steps:
      - "Log call outcome 'Not owner, rented house or no suitable roof (NOT_OWNER_NO_ROOF)'"
    expected_result: "Lead marked Lost (not_owner_no_roof)"
    type: "auto"

  - id: "UAT-014"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Asked not to be called again (Do Not Contact)"
    preconditions: "Lead in Attempting Contact"
    steps:
      - "Log call outcome 'Asked not to be called again (DO_NOT_CONTACT)'"
    expected_result: "do_not_contact flag enabled, all outgoing SMS/WhatsApp/Call buttons disabled"
    type: "auto"

  - id: "UAT-015"
    role: "salesperson"
    region: "IN"
    title: "Call outcome: Duplicate enquiry"
    preconditions: "Lead in New status with duplicate phone in system"
    steps:
      - "Log call outcome 'Duplicate enquiry (DUPLICATE_ENQUIRY)' and link primary lead"
    expected_result: "Lead status set to Duplicate and merged into primary lead timeline"
    type: "auto"

  # ----------------------------------------------------------------------------
  # SECTION 2: CORE SURVEY OUTCOMES (7 Out of 7)
  # ----------------------------------------------------------------------------
  - id: "UAT-016"
    role: "manager"
    region: "IN"
    title: "Survey outcome: Survey booked"
    preconditions: "Lead in Survey to Schedule"
    steps:
      - "Select surveyor, scheduled date and time slot"
      - "Submit survey booking"
    expected_result: "Status updates to Survey Scheduled, notification sent to surveyor"
    type: "auto"

  - id: "UAT-017"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Customer asks to reschedule"
    preconditions: "Survey in Booked status"
    steps:
      - "Log survey outcome 'Customer asks to reschedule (SURVEY_RESCHEDULE)'"
      - "Pick new date 2 days later with remark"
    expected_result: "Survey status set to Rescheduled, customer SMS notification queued"
    type: "auto"

  - id: "UAT-018"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Customer not reachable on site"
    preconditions: "Survey scheduled for today"
    steps:
      - "Log outcome 'Customer not at site or not reachable (SURVEY_CUSTOMER_UNREACHABLE)'"
    expected_result: "Survey marked Missed, lead flagged for salesperson follow-up"
    type: "auto"

  - id: "UAT-019"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Surveyor delayed or cancels"
    preconditions: "Survey scheduled"
    steps:
      - "Log outcome 'Surveyor cancels or is delayed (SURVEYOR_DELAYED)' with reason"
    expected_result: "Manager alerted to reassign survey or reschedule slot"
    type: "auto"

  - id: "UAT-020"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Survey done, site suitable"
    preconditions: "Survey scheduled"
    steps:
      - "Upload roof photos, enter usable area 450 sqft, structure RCC"
      - "Log outcome 'Survey done, site suitable (SURVEY_DONE_SUITABLE)'"
    expected_result: "Status moves to Design Pending, quote generator unlocked"
    type: "auto"

  - id: "UAT-021"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Survey done, site not suitable"
    preconditions: "Survey scheduled"
    steps:
      - "Log outcome 'Survey done, site not suitable (SURVEY_DONE_UNSUITABLE)' with shade notes"
    expected_result: "Lead transitions to Lost Approval Pending with manager notification"
    type: "auto"

  - id: "UAT-022"
    role: "surveyor"
    region: "IN"
    title: "Survey outcome: Customer changes mind before survey"
    preconditions: "Survey scheduled"
    steps:
      - "Log outcome 'Customer changes mind (SURVEY_CHANGES_MIND)'"
    expected_result: "Survey cancelled, lead returned to Salesperson queue"
    type: "auto"

  # ----------------------------------------------------------------------------
  # SECTION 3: CORE QUOTE OUTCOMES (7 Out of 7)
  # ----------------------------------------------------------------------------
  - id: "UAT-023"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Quote sent, no reply"
    preconditions: "Quote version 1 generated and emailed"
    steps:
      - "Log quote follow-up 'Quote sent, no reply (QUOTE_SENT_NO_REPLY)'"
    expected_result: "Next follow-up date set to +3 business days per rule"
    type: "auto"

  - id: "UAT-024"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer asks technical questions"
    preconditions: "Quote in Sent status"
    steps:
      - "Log outcome 'Customer asks questions (QUOTE_QUESTIONS)' with remark"
    expected_result: "Lead stays in Quote Sent, question recorded in timeline"
    type: "auto"

  - id: "UAT-025"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer requests changes (revision)"
    preconditions: "Quote in Sent status"
    steps:
      - "Log outcome 'Customer asks for changes (QUOTE_REVISION)'"
      - "Create revised Quote Version 2 (6kW instead of 5kW)"
    expected_result: "Quote v1 superseded, Quote v2 set as active, status Revising Quote"
    type: "auto"

  - id: "UAT-026"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer compares with competitor (Negotiation)"
    preconditions: "Quote v2 active"
    steps:
      - "Log outcome 'Customer compares with competitor (QUOTE_NEGOTIATION)'"
    expected_result: "Status advances to Negotiation, competitor discount field enabled"
    type: "auto"

  - id: "UAT-027"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer wants to wait"
    preconditions: "Quote in Negotiation status"
    steps:
      - "Log outcome 'Customer wants to wait (QUOTE_WAIT)'"
    expected_result: "Lead moved to Nurture queue with follow-up in 45 days"
    type: "auto"

  - id: "UAT-028"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer accepts proposal (Won)"
    preconditions: "Quote in Negotiation or Quote Sent"
    steps:
      - "Click 'Accept Quote - Mark Won' and enter deposit details"
    expected_result: "Lead status becomes Won, won_at timestamp recorded, celebration banner shown"
    type: "auto"

  - id: "UAT-029"
    role: "salesperson"
    region: "IN"
    title: "Quote outcome: Customer rejects proposal"
    preconditions: "Quote in Sent status"
    steps:
      - "Click 'Customer Rejects (QUOTE_LOST)' and select reason 'Price too high'"
    expected_result: "Lead moves to Lost Approval Pending requiring manager review"
    type: "auto"

  # ----------------------------------------------------------------------------
  # SECTION 4: CORE WORKFLOWS & AUTOMATION (UAT-030 to UAT-060)
  # ----------------------------------------------------------------------------
  - id: "UAT-030"
    role: "salesperson"
    region: "IN"
    title: "Retry ladder: 4 consecutive No Answers leads to Unreachable then Lost"
    preconditions: "Lead in New status"
    steps:
      - "Log Call: No Answer (Attempt 1)"
      - "Log Call: No Answer (Attempt 2)"
      - "Log Call: No Answer (Attempt 3)"
      - "Log Call: No Answer (Attempt 4)"
    expected_result: "Attempt count reaches 4, status automatically updates to Lost (Unreachable)"
    type: "auto"

  - id: "UAT-031"
    role: "salesperson"
    region: "IN"
    title: "Full end-to-end journey from New to Won with remarks at each step"
    preconditions: "Clean fresh lead created"
    steps:
      - "Create lead with contact and address info"
      - "Log Call: Interested with remark"
      - "Book Survey with remark"
      - "Complete Survey: Suitable with remark"
      - "Create Quote v1 and dispatch"
      - "Accept Quote to Won with payment remark"
    expected_result: "Complete timeline displays all 6 audit entries with matching user and remarks"
    type: "auto"

  - id: "UAT-032"
    role: "salesperson"
    region: "IN"
    title: "Lead to Nurture and return to Active Pipeline"
    preconditions: "Lead in Interested status"
    steps:
      - "Move to Nurture with reason waiting_loan"
      - "Verify presence in Nurture tab"
      - "Reactivate lead from Nurture with remark 'Loan sanctioned'"
    expected_result: "Lead returns to Active Leads list in Follow Up Scheduled status"
    type: "auto"

  - id: "UAT-033"
    role: "salesperson"
    region: "IN"
    title: "Duplicate phone detection warning on lead creation"
    preconditions: "Lead exists with phone 9825100001"
    steps:
      - "Attempt to create second lead with same phone 9825100001"
    expected_result: "Duplicate warning modal surfaces existing lead link with option to merge or view"
    type: "auto"

  - id: "UAT-034"
    role: "manager"
    region: "IN"
    title: "CSV Import of 200 leads with 10 invalid rows"
    preconditions: "CSV file containing 190 valid rows and 10 malformed phones/emails"
    steps:
      - "Upload CSV file in Import Leads page"
      - "Map columns and execute import"
    expected_result: "190 leads successfully imported, error report generated for 10 rows with error details"
    type: "auto"

  - id: "UAT-035"
    role: "manager"
    region: "IN"
    title: "Undo recent CSV Import batch"
    preconditions: "Import batch completed in UAT-034"
    steps:
      - "Click 'Revert Batch' on the import history row"
    expected_result: "All 190 imported leads deleted, batch status marked Reverted"
    type: "auto"

  - id: "UAT-036"
    role: "surveyor"
    region: "IN"
    title: "Surveyor workflow on 390px mobile viewport"
    preconditions: "Surveyor logged in with assigned surveys on mobile viewport"
    steps:
      - "Open My Surveys tab on 390px screen"
      - "Click into survey detail"
      - "Fill roof measurements and submit site suitable"
    expected_result: "All touch targets >= 44px, bottom sheet layout renders cleanly without horizontal overflow"
    type: "auto"

  - id: "UAT-037"
    role: "manager"
    region: "IN"
    title: "Manager KPI dashboard validation"
    preconditions: "Leads seeded across New, Interested, Survey, Quote, Won"
    steps:
      - "Navigate to Dashboard"
      - "Verify funnel counts and conversion percentages"
    expected_result: "Funnel numbers match database counts, overdue follow-up alert badges render accurately"
    type: "auto"

  - id: "UAT-038"
    role: "admin"
    region: "ALL"
    title: "Admin changes default follow-up days for outcome"
    preconditions: "Admin logged into Masters settings"
    steps:
      - "Navigate to Master Data -> Outcomes"
      - "Edit 'Customer asks to call later' default days from 1 to 2"
      - "Save outcome settings"
    expected_result: "Future logging of that outcome calculates next follow-up at +2 days by default"
    type: "auto"

  - id: "UAT-039"
    role: "any"
    region: "ALL"
    title: "Password reset request and confirmation"
    preconditions: "Active user account demo_sales_in"
    steps:
      - "Request reset on /forgot-password with email"
      - "Retrieve token from backend outbox"
      - "Submit new password meeting complexity criteria"
    expected_result: "Password updated, user can log in with new password immediately"
    type: "auto"

  - id: "UAT-040"
    role: "manager"
    region: "IN"
    title: "Daily morning digest email generation"
    preconditions: "Scheduler active with leads due today"
    steps:
      - "Trigger management command run_daily_digest"
    expected_result: "Email queued with Today's follow-up list, pending surveys, and manager attention items"
    type: "auto"

  - id: "UAT-041"
    role: "salesperson"
    region: "IN"
    title: "Web push notification permission dialog acceptance"
    preconditions: "User logged in with notification permission default"
    steps:
      - "Accept notification prompt in application header"
    expected_result: "Browser subscription endpoint registered on server, test notification delivered"
    type: "auto"

  - id: "UAT-042"
    role: "salesperson"
    region: "ALL"
    title: "PWA Service Worker registration and desktop app installability"
    preconditions: "Application loaded in desktop browser"
    steps:
      - "Verify service worker registration"
      - "Inspect web manifest for standalone display, icons, and theme color"
    expected_result: "Install button surfaces in sidebar, manifest validates with 100% PWA compliance"
    type: "auto"

  - id: "UAT-043"
    role: "salesperson"
    region: "IN"
    title: "Interactive product tour completion"
    preconditions: "New user session"
    steps:
      - "Start product tour from Tour Center"
      - "Step through all 5 tour steps to completion"
    expected_result: "Tour finishes cleanly, completed_tours recorded on server"
    type: "auto"

  - id: "UAT-044"
    role: "salesperson"
    region: "IN"
    title: "Helpbot: 5 in-scope CRM workflow answers"
    preconditions: "Helpbot assistant drawer opened"
    steps:
      - "Ask: 'How do I log a call outcome?'"
      - "Ask: 'What happens when customer asks to reschedule a survey?'"
      - "Ask: 'What is the retry ladder for unreachable leads?'"
      - "Ask: 'How do I generate a quote PDF?'"
      - "Ask: 'Who can approve a Lost lead?'"
    expected_result: "All 5 queries receive accurate markdown answers with relevant tour shortcut links"
    type: "auto"

  - id: "UAT-045"
    role: "salesperson"
    region: "IN"
    title: "Helpbot: 5 out-of-scope refusals with suggested questions"
    preconditions: "Helpbot assistant drawer opened"
    steps:
      - "Ask: 'What is the weather in Delhi?'"
      - "Ask: 'Write Python code to sort an array'"
      - "Ask: 'Tell me a joke about solar energy'"
      - "Ask: 'Who won the cricket world cup?'"
      - "Ask: 'How do I cook biryani?'"
    expected_result: "All 5 queries politely refused as out of scope, providing 3 CRM starter suggestions"
    type: "auto"

  - id: "UAT-046"
    role: "salesperson"
    region: "IN"
    title: "Today queue prioritization"
    preconditions: "Leads with past follow-up, today follow-up, and future follow-up"
    steps:
      - "Open Today page"
    expected_result: "Overdue items shown at top in red, today's items below in order of scheduled time"
    type: "auto"

  - id: "UAT-047"
    role: "manager"
    region: "IN"
    title: "Manager needs-attention queue displays unassigned leads"
    preconditions: "Leads created without assigned_to salesperson"
    steps:
      - "Open Manager Attention page"
    expected_result: "Unassigned leads listed with 1-click salesperson assignment dropdown"
    type: "auto"

  - id: "UAT-048"
    role: "salesperson"
    region: "IN"
    title: "Lead search by phone number substring"
    preconditions: "Lead with phone 9825123456"
    steps:
      - "Enter '123456' into global search input"
    expected_result: "Search results immediately filter to the matching lead"
    type: "auto"

  - id: "UAT-049"
    role: "salesperson"
    region: "IN"
    title: "Lead search by customer name substring"
    preconditions: "Lead named 'Rajesh Patel'"
    steps:
      - "Enter 'Rajesh' in leads list search"
    expected_result: "Lead 'Rajesh Patel' returned in results table"
    type: "auto"

  - id: "UAT-050"
    role: "salesperson"
    region: "IN"
    title: "Lead edit updates address and electricity details"
    preconditions: "Lead exists in system"
    steps:
      - "Edit address to 'Shop 12, MG Road' and monthly bill to 6500"
      - "Save lead"
    expected_result: "Lead details updated, audit entry logged with previous and new values"
    type: "auto"

  - id: "UAT-051"
    role: "manager"
    region: "IN"
    title: "Audit log captures user IP and exact field diffs"
    preconditions: "Status change performed on lead"
    steps:
      - "Open lead timeline and inspect audit log modal"
    expected_result: "Timestamp, user, IP address, changed fields, and previous/new states displayed"
    type: "auto"

  - id: "UAT-052"
    role: "salesperson"
    region: "IN"
    title: "WhatsApp template message preview and dispatch"
    preconditions: "Lead in Interested status"
    steps:
      - "Click WhatsApp icon on lead card"
      - "Select 'Information Brochure' template"
      - "Send message"
    expected_result: "Message queued with interpolated customer name and system size, activity logged"
    type: "auto"

  - id: "UAT-053"
    role: "salesperson"
    region: "IN"
    title: "SMS message character counter & GSM-7 encoding warning"
    preconditions: "Lead detail SMS composer opened"
    steps:
      - "Type 150 characters of ASCII text"
      - "Add one Unicode Hindi word 'नमस्ते'"
    expected_result: "Counter switches from 160 GSM-7 segment to 70 UCS-2 segment warning"
    type: "auto"

  - id: "UAT-054"
    role: "salesperson"
    region: "IN"
    title: "Mandatory remarks on every status transition"
    preconditions: "Lead in New status"
    steps:
      - "Attempt to change status without entering remark"
    expected_result: "Form submission blocked with validation error 'Remark is mandatory for status change'"
    type: "auto"

  - id: "UAT-055"
    role: "manager"
    region: "IN"
    title: "Lead status history chronology"
    preconditions: "Lead transitioned through 3 different statuses"
    steps:
      - "Inspect Status History tab"
    expected_result: "Entries listed in reverse chronological order with time-in-status duration"
    type: "auto"

  - id: "UAT-056"
    role: "admin"
    region: "ALL"
    title: "Database backup creation and integrity check"
    preconditions: "Admin CLI access"
    steps:
      - "Execute python scripts/backup_db.py"
    expected_result: "Compressed backup dump created in backups/ directory with non-zero byte size"
    type: "auto"

  - id: "UAT-057"
    role: "admin"
    region: "ALL"
    title: "Database restore from backup verification"
    preconditions: "Recent backup file available"
    steps:
      - "Execute python scripts/restore_db.py on test database"
    expected_result: "All tables, rows, and constraints restored without corruption"
    type: "auto"

  - id: "UAT-058"
    role: "salesperson"
    region: "IN"
    title: "AI suggestions: Situation summary and recommended pitch"
    preconditions: "Lead with 2 logged calls and 1 site survey"
    steps:
      - "Open AI Coach tab on lead detail page"
      - "Click 'Generate Suggestions'"
    expected_result: "Situation summary generated, PII scrubbed, next action pitch provided with confidence score"
    type: "auto"

  - id: "UAT-059"
    role: "salesperson"
    region: "IN"
    title: "AI suggestions cache hit within 24 hours"
    preconditions: "Suggestion generated in UAT-058"
    steps:
      - "Re-open AI Coach tab without clicking refresh"
    expected_result: "Cached suggestion rendered in under 100ms without making outbound LLM API call"
    type: "auto"

  - id: "UAT-060"
    role: "admin"
    region: "ALL"
    title: "Production readiness health check endpoint"
    preconditions: "Production server running"
    steps:
      - "GET /api/health/"
    expected_result: "Returns HTTP 200 with database: healthy, cache: ready, disk: ok"
    type: "auto"

  # ----------------------------------------------------------------------------
  # SECTION 5: INDIA AND AUSTRALIA MULTI-COUNTRY (UAT-061 to UAT-080)
  # ----------------------------------------------------------------------------
  - id: "UAT-061"
    role: "salesperson"
    region: "IN"
    title: "Indian salesperson restricted to Indian region"
    preconditions: "demo_sales_in user logged in"
    steps:
      - "View leads list"
      - "Attempt to query ?region=AU"
    expected_result: "Only Indian leads visible; AU query returns HTTP 403 Forbidden"
    type: "auto"

  - id: "UAT-062"
    role: "salesperson"
    region: "AU"
    title: "Australian salesperson restricted to Australian region"
    preconditions: "demo_sales_au user logged in"
    steps:
      - "View leads list"
      - "Attempt to query ?region=IN"
    expected_result: "Only Australian leads visible; IN query returns HTTP 403 Forbidden"
    type: "auto"

  - id: "UAT-063"
    role: "manager"
    region: "ALL"
    title: "Manager switches between India and Australia regions"
    preconditions: "demo_manager has access to both IN and AU"
    steps:
      - "Select 'India (IN)' in header region selector"
      - "Verify Indian leads and INR currency"
      - "Select 'Australia (AU)' in header region selector"
    expected_result: "Leads list switches to AU leads, currency changes to AUD ($), timezone updates"
    type: "auto"

  - id: "UAT-064"
    role: "salesperson"
    region: "AU"
    title: "Australian leads: Perth (AWST) vs Sydney (AEST) local time boundaries"
    preconditions: "One lead in Perth (WA) and one lead in Sydney (NSW)"
